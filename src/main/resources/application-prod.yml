spring:
  datasource:
    url: jdbc:mysql://${SPRING_DATABASE_HOST}:3306/${SPRING_DATABASE_SCHEMA}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${SPRING_DATABASE_USERNAME}
    password: ${SPRING_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

discord:
  webhook:
    url: { DISCORD_WEBHOOK_URL }

gemini:
  api:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-2.5-flash-latest}
    key: ${GEMINI_KEY}
    url: ${gemini.api.base-url}/v1beta/models/${gemini.api.model}:generateContent

# 운세 관련 기능 토글 (운영에서는 안정성 우선, 환경변수로 제어)
fortune:
  prompt:
    version: ${FORTUNE_PROMPT_VERSION:v2}
  external-data:
    enabled: ${EXTERNAL_FORTUNE_ENABLED:false}
    fallback-to-basic: ${FALLBACK_TO_BASIC:true}
